services:
  gazebo_dev:
    build: . 
    container_name: bs_sim
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-ubuntu
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./workspace:/home/ubuntu/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/runtime-ubuntu/${WAYLAND_DISPLAY}:rw
      - /dev/dri:/dev/dri:rw
      # Persistent Gazebo Fuel model cache
      - gz_fuel_cache:/home/ubuntu/.gz

    stdin_open: true
    tty: true
    command: bash

volumes:
  gz_fuel_cache:
